<style>
  /* Layout: one-column phone app, three views switched by a fixed bottom tab bar. */
  :root{
    --bg:#EEF0EC; --surface:#FFFFFF; --surface-2:#E3E7E1; --ink:#14181A; --muted:#5A6367; --border:#D3D8D1;
    --accent:#1F55CF; --accent-soft:#DCE5FA; --good:#2C7A4B; --warn:#B0541A; --warn-soft:#F6E3D5;
    --c-wri:#2E6F61; --c-mth:#A8681D; --c-bus:#33578C; --c-bio:#3C7A43; --c-ara:#8A3A6C;
    --display:'Archivo','Arial Narrow',system-ui,sans-serif;
    --body:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
    --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
    --nav-h:64px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1113; --surface:#161B1E; --surface-2:#1F2529; --ink:#E8ECEA; --muted:#9BA4A9; --border:#2A3135;
      --accent:#86A6FF; --accent-soft:#1C2742; --good:#6CC08D; --warn:#F09A5F; --warn-soft:#3A2618;
      --c-wri:#6FCBB4; --c-mth:#E7AC5E; --c-bus:#8FB0E6; --c-bio:#82CB8A; --c-ara:#D890BC;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1113; --surface:#161B1E; --surface-2:#1F2529; --ink:#E8ECEA; --muted:#9BA4A9; --border:#2A3135;
    --accent:#86A6FF; --accent-soft:#1C2742; --good:#6CC08D; --warn:#F09A5F; --warn-soft:#3A2618;
    --c-wri:#6FCBB4; --c-mth:#E7AC5E; --c-bus:#8FB0E6; --c-bio:#82CB8A; --c-ara:#D890BC;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
  .wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(var(--nav-h) + 32px + env(safe-area-inset-bottom,0px))}

  h1,h2,h3{font-family:var(--display);font-stretch:75%;margin:0;text-wrap:balance;letter-spacing:.005em}
  h1{font-size:34px;font-weight:800;line-height:1.05}
  h2{font-size:24px;font-weight:750;line-height:1.1}
  h3{font-size:19px;font-weight:700}
  .eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0}
  .muted{color:var(--muted)}
  .view{display:flex;flex-direction:column;gap:18px}
  .head{display:flex;flex-direction:column;gap:4px}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
  .card-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
  .pill{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
  .pill.rest{background:var(--surface-2);color:var(--muted)}
  .pill.warn{background:var(--warn-soft);color:var(--warn)}

  /* workout hero on Today */
  .workout{border-color:var(--accent)}
  .workout .big{font-family:var(--display);font-stretch:62%;font-weight:800;font-size:56px;line-height:.9;text-transform:uppercase;color:var(--accent)}
  .mini-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
  .mini-list li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--border);font-size:15px}
  .mini-list li:first-child{border-top:none}
  .mini-list .tag{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
  .btn{appearance:none;border:1px solid var(--border);background:var(--surface-2);color:var(--ink);font:600 14px var(--body);padding:9px 14px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;align-self:flex-start}
  .btn:hover{border-color:var(--accent)}
  .btn:focus-visible,.check:focus-visible,.tab:focus-visible,.day:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* deadline rows */
  .rows{display:flex;flex-direction:column;gap:8px}
  .row{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--border);border-left:4px solid var(--c);border-radius:10px;background:var(--surface)}
  .row.done{opacity:.55}
  .row.done .name{text-decoration:line-through}
  .row .txt{min-width:0}
  .row .name{font-weight:600;font-size:15px}
  .row .detail{font-size:13px;color:var(--muted)}
  .row .when{text-align:right;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .row .when b{display:block;font-size:13px;color:var(--ink)}
  .row .when span{color:var(--muted)}
  .row.past:not(.done) .when b{color:var(--warn)}
  .check{appearance:none;width:24px;height:24px;border-radius:7px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;color:var(--surface);font-size:14px;line-height:1}
  .done .check{background:var(--c);border-color:var(--c)}
  .done .check::after{content:"\2713"}

  .classes{display:flex;flex-direction:column;gap:6px}
  .class{display:flex;gap:10px;align-items:baseline;font-size:15px}
  .class .t{font-family:var(--mono);font-size:12.5px;color:var(--muted);min-width:96px;font-variant-numeric:tabular-nums}
  .class .c{font-weight:600;color:var(--c)}

  /* gym */
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .day{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;min-width:0}
  .day .d{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;color:var(--muted)}
  .day .w{font-family:var(--display);font-stretch:62%;font-weight:750;font-size:15px}
  .day.rest .w{color:var(--muted)}
  .day.today{border-color:var(--accent)}
  .day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
  .day[aria-pressed="true"] .d,.day[aria-pressed="true"] .w{color:var(--surface)}
  .ex{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--border)}
  .ex:first-of-type{border-top:none;padding-top:0}
  .ex-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .ex-name{font-weight:700;font-size:17px}
  .ex-tag{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
  .ex ol{margin:0;padding-left:20px;font-size:14.5px;color:var(--ink);display:flex;flex-direction:column;gap:2px}
  .ex-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .sets{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--accent)}
  .watch{font-size:14px;font-weight:600;color:var(--accent);text-decoration:none}
  .watch:hover{text-decoration:underline}
  .rules p{margin:0;font-size:14.5px}
  .ladder{display:flex;gap:4px;align-items:flex-end;height:42px}
  .ladder span{flex:1;background:var(--accent-soft);border-radius:3px 3px 0 0;position:relative}
  .ladder span.up{background:var(--accent)}
  .ladder-cap{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .rest-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:16px}
  .rest-list li{display:flex;gap:10px;align-items:center}
  .rest-list li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}

  /* school */
  .about{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .about div{display:flex;flex-direction:column;gap:2px;min-width:0}
  .about .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .about .v{font-weight:600;font-size:15px}
  .progress{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
  .progress i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s ease}
  .month{display:flex;flex-direction:column;gap:8px}
  .month h3{display:flex;align-items:baseline;gap:8px}
  .month h3 small{font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--muted)}
  .courses{display:flex;flex-direction:column}
  .course{display:grid;grid-template-columns:72px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--border);font-size:14.5px}
  .course:first-child{border-top:none}
  .course .code{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--c)}
  .course .meta{color:var(--muted);font-size:13px}
  .status{font-family:var(--mono);font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
  .status::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--muted)}
  .status.live::before{background:var(--good)}

  /* bottom tabs */
  nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
  nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--nav-h)}
  .tab{appearance:none;border:none;background:none;color:var(--muted);font:700 15px var(--display);font-stretch:75%;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
  .tab::before{content:"";width:22px;height:3px;border-radius:2px;background:transparent}
  .tab[aria-selected="true"]{color:var(--accent)}
  .tab[aria-selected="true"]::before{background:var(--accent)}
  .empty{font-size:14.5px;color:var(--muted);margin:0}
  @media (max-width:380px){ .workout .big{font-size:46px} .day .w{font-size:13px} }
  @media (prefers-reduced-motion: reduce){ *{transition:none!important} }

  .actions{display:flex;gap:10px;flex-wrap:wrap}
  button.music{border:none;cursor:pointer}

  /* in-app voice screen */
  #talk{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding-inline:24px;
    padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));
    background:radial-gradient(circle at 50% 40%,#1E2436 0%,#06070B 72%);color:#F3E3B5;text-align:center}
  .orb{width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF5D6 0%,#F0D07E 30%,#C4943A 62%,#7A5418 100%);
    box-shadow:0 0 calc(30px + var(--lvl,0) * 90px) rgba(240,208,126,calc(.25 + var(--lvl,0) * .5));transform:scale(calc(1 + var(--lvl,0) * .18));transition:transform .08s linear,box-shadow .08s linear}
  #talk[data-state="connecting"] .orb{animation:breathe 1.4s ease-in-out infinite}
  @keyframes breathe{50%{transform:scale(.92);opacity:.8}}
  .talk-status{font-family:var(--display);font-stretch:75%;font-weight:700;font-size:26px;letter-spacing:.04em;margin:0}
  .talk-line{min-height:3em;max-width:34ch;margin:0;font-size:16px;color:#C9BC98}
  .talk-end{appearance:none;border:1.5px solid #F0D07E;background:transparent;color:#F7DE96;font:700 16px var(--body);padding:12px 34px;border-radius:999px;cursor:pointer}
  .talk-end:focus-visible{outline:2px solid #F7DE96;outline-offset:3px}
  .talk-alt{color:#9C916F;font-size:13.5px}
  @media (prefers-reduced-motion: reduce){ .orb{transition:none} #talk[data-state="connecting"] .orb{animation:none} }
  .hello{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .music{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;padding:10px 16px;border-radius:10px;text-decoration:none;
    font:700 14.5px var(--body);color:#1B1408;background:linear-gradient(115deg,#F7DE96,#C4943A 45%,#F0D07E 70%,#B8862B)}
  .music:hover{filter:brightness(1.05)}
  .music:focus-visible{outline:2px solid var(--accent);outline-offset:2px}


  /* welcome splash, matches the gold icon */
  #splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
    background:radial-gradient(circle at 50% 42%,#1E2436 0%,#06070B 70%);color:#F3E3B5;cursor:pointer;
    animation:splash-out .35s ease-in 1.4s forwards}
  #splash svg{width:132px;height:auto;overflow:visible}
  #splash .stem{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);animation:grow .4s cubic-bezier(.2,.8,.2,1) forwards}
  #splash .ring{stroke-dasharray:880;stroke-dashoffset:880;animation:draw .55s cubic-bezier(.4,0,.2,1) .25s forwards}
  #splash .cap{opacity:0;transform:translateY(-60px);animation:drop .3s cubic-bezier(.2,1.4,.4,1) .7s forwards}
  #splash p{margin:0;font-family:var(--display);font-stretch:75%;font-weight:600;font-size:22px;letter-spacing:.06em;opacity:0;transform:translateY(8px);animation:rise .35s ease-out .8s forwards}
  #splash p b{font-weight:800;color:#F7DE96}
  @keyframes grow{to{transform:scaleY(1)}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes drop{to{opacity:1;transform:none}}
  @keyframes rise{to{opacity:1;transform:none}}
  @keyframes splash-out{to{opacity:0;visibility:hidden}}
  @media (prefers-reduced-motion: reduce){
    #splash .stem,#splash .ring,#splash .cap,#splash p{animation:none;transform:none;opacity:1;stroke-dashoffset:0}
    #splash{animation:splash-out .4s ease 1s forwards}
  }
</style>
</head>

      </linearGradient>

<script>
(function(){
  // Plays on every launch, and again whenever the app comes back from the background.
  var template = document.getElementById('splash').cloneNode(true), el = null, timer = null;
  function done(){ clearTimeout(timer); if(el && el.parentNode) el.parentNode.removeChild(el); el = null; }
  function play(){
    done();
    el = document.getElementById('splash') || document.body.insertBefore(template.cloneNode(true), document.body.firstChild);
    el.addEventListener('click', done);
    timer = setTimeout(done, 1800);
  }
  play();
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'visible') play(); });
})();
</script>

  // JS getDay(): 0 = Sunday … 6 = Saturday

  }
  checkForUpdate();
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'visible') checkForUpdate(); });
})();

    box.hidden = false;
    lineEl.textContent = 'Step 1/3: waiting for microphone…';
    setStatus('Connecting…', 'connecting');
    // Ask for the mic straight from the tap, then hand over to the SDK.
    var mic = navigator.mediaDevices && navigator.mediaDevices.getUserMedia ? navigator.mediaDevices.getUserMedia({audio:true}) : Promise.reject(new Error('no-mic'));
    within(mic, 10000, 'mic').then(function(stream){
      stream.getTracks().forEach(function(t){ t.stop(); });
      if(!closing) lineEl.textContent = 'Step 2/3: loading voice tools…';
      return within(import(SDK_URL), 15000, 'sdk');
    }).then(function(mod){
      if(closing) return;
      lineEl.textContent = 'Step 3/3: connecting to Claude…';
      var attempt = ++attemptId;
      var sess = mod.Conversation.startSession({
        agentId: AGENT_ID,
        connectionType: 'websocket',
        dynamicVariables: window.trackerContext ? window.trackerContext() : {},
        onConnect: function(){ setStatus('Listening', 'listening'); lineEl.textContent = ''; },
        onDisconnect: function(){ if(!closing && convo){ close(); } },
        onModeChange: function(m){ mode = val(m, 'mode') || 'listening'; setStatus(mode === 'speaking' ? 'Speaking' : 'Listening', mode); },
        onMessage: function(m){ var t = val(m, 'message'); if(t) lineEl.textContent = t; },
        onError: function(e){ lineEl.textContent = (val(e, 'message') || String(e || 'Something went wrong')).slice(0, 160); }
      });
      // A session that connects after we gave up (timeout, End) must not keep running.
      sess.then(function(c){ if(closing || attempt !== attemptId || box.getAttribute('data-state') === 'error'){ try{ c.endSession(); }catch(e){} } }, function(){});
      return within(sess, 20000, 'connect').then(function(c){
        if(closing || attempt !== attemptId) return;
        convo = c; pump();
      });
    }).catch(function(err){
      if(closing) return;
      var step = (err && err.step) || 'connect';
      var detail = err && err.error ? ' (' + String(val(err.error, 'message') || err.error).slice(0, 90) + ')' : err && err.timeout ? ' (timed out)' : '';
      fail(STEP_HELP[step] + detail + ' Tap “Open in Safari instead” below.');
    });
  }

  document.addEventListener('click', function(ev){ if(ev.target.closest('[data-talk]')) open(); });
  document.getElementById('talk-end').addEventListener('click', close);
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'hidden' && !box.hidden) close(); });
})();
</script>
</body>
</html>
